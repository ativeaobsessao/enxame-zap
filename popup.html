<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enxame Zap</title>
<style>
  body {
    width: 320px;
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif;
    background: #fbfbfd;
    color: #1d1d1f;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(0,0,0,0.06);
  }
  .badge {
    width: 32px;
    height: 32px;
    background: #1d1d1f;
    border-radius: 10px;
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 800;
    font-size: 16px;
  }
  h1 { font-size: 15px; margin: 0; font-weight: 700; }
  p { font-size: 11px; color: #86868b; margin: 2px 0 0; }
  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat-card {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.08);
    border-radius: 12px;
    padding: 8px;
    text-align: center;
  }
  .stat-card b { display: block; font-size: 17px; font-weight: 700; }
  .stat-card span { font-size: 10px; color: #86868b; text-transform: uppercase; }
  .btn-group { display: flex; flex-direction: column; gap: 8px; }
  .btn {
    border: none;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    display: block;
    transition: .15s;
  }
  .btn.primary { background: #1d1d1f; color: #fff; }
  .btn.primary:hover { background: #000; }
  .btn.secondary { background: #f5f5f7; color: #1d1d1f; }
  .btn.secondary:hover { background: #e5e5ea; }
  .btn.whatsapp { background: #25d366; color: #fff; }
  .btn.whatsapp:hover { background: #1ebd5b; }
</style>
</head>
<body>
  <div class="header">
    <div class="badge">E</div>
    <div>
      <h1>Enxame Zap</h1>
      <p>PTT ZapVoice 48kHz • Funis</p>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <b id="count-audios">0</b>
      <span>Áudios</span>
    </div>
    <div class="stat-card">
      <b id="count-funis">0</b>
      <span>Funis</span>
    </div>
    <div class="stat-card">
      <b id="count-midias">0</b>
      <span>Mídias</span>
    </div>
  </div>

  <div class="btn-group">
    <button id="open-whatsapp" class="btn whatsapp">Abrir WhatsApp Web</button>
    <button id="open-builder" class="btn primary">Abrir Construtor de Funil</button>
    <button id="export-all" class="btn secondary">Exportar Backup JSON</button>
    <label class="btn secondary" style="cursor:pointer">
      Importar Backup JSON
      <input type="file" id="import-file" accept=".json" hidden>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
